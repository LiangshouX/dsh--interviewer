# dsh-realtime-interview bundle patch
#
# One Host row. The row id is the plugin id the Plugin Manager shows;
# `name` must equal the package name so the client-modules scan resolves this
# package's ./client bundle and serves it at /plugins/dsh-realtime-interview/client.js.
#
# `config` is replaced wholesale by any later patch layer, so every field the
# plugin needs is restated here. The user edits their own layer
# (`~/.dsh/profiles/<profile>/cordis.patch.yml`) to change these values; that
# layer survives plugin upgrades.
#
#   workspaceRoot   工作区根——**所有数据都集中在这里**，一场面试一个子目录：
#                     <root>/workspaces/<session-id>/   一场面试
#                     <root>/profiles/<profile-id>/     岗位档案
#                   留空 = 自动。Windows 上自动挑**非系统盘**（D 盘优先，
#                   目录名 DSH-REALTIME-INTERVIEW）；没有别的盘才用用户主目录。
#                   想指到别处，就写绝对路径，例如 D:\DSH-REALTIME-INTERVIEW-ROOT。
#                   也可以在插件面板里点「浏览…」用系统目录选择器来选——
#                   那个选择存在 profile 的 dsh-realtime-interview.json 里，不动本文件，
#                   且本文件写死时以本文件为准（面板改动只会给出提示）。
#                   （dataRoot 是旧名，仍然认，但请换用 workspaceRoot。）
#   jdFetchTimeoutMs  JD 链接抓取超时（毫秒）。超时即视为失败，交给手动兜底。
#   jdMaxChars      JD 抓取后保留的最大字符数（正文裁剪）。
#   asrProvider     语音识别来源：auto | host | openai | minimax | browser | none
#                   auto = **宿主优先**（宿主的 speechToText 服务，provider 由宿主
#                   决定，插件不经手凭据）→ 插件自己的服务端识别 → 浏览器原生。
#                   host = 只用宿主语音服务；openai/minimax = 只用插件自己的端点。
#   asrBaseUrl      服务端识别基址（仅在插件自己走服务端时用）
#   asrApiKey       明文 key（不推荐；优先用 asrApiKeyEnv）
#   asrApiKeyEnv    凭据名（走 DSH credentials seam，密钥不进配置文件）
#   asrModel        识别模型，留空按协议取（openai: whisper-1 / minimax: asr-1.0）
#   asrEndpoint     转写路径，留空按协议取
#   asrLanguage     识别语言提示，默认 zh
#   ttsProvider     语音播报来源：auto | host | mimo | openai | minimax | baidu | edge | browser | none
#                   auto = 配了凭据的模型 → 免密钥的自然音（百度 / Edge 神经音色）
#                   → 浏览器原生音色。**默认不是系统机器音。**
#   ttsBaseUrl      合成服务基址（留空用该 provider 的默认值）
#   ttsApiKeyEnv    合成凭据名（MIMO_API_KEY / OPENAI_API_KEY / MINIMAX_API_KEY）
#   ttsApiKey       明文 key（不推荐）
#   ttsModel        合成模型。MiMo 三种：mimo-v2.5-tts（预置音色）/
#                   mimo-v2.5-tts-voicedesign（文本描述音色）/ mimo-v2.5-tts-voiceclone（样本复刻）
#   ttsVoice        预置音色 id（mimo 默认 mimo_default；openai 默认 alloy）
#   ttsStyle        自然语言风格指令（音色设计描述 / 情绪语气语速）
#   ttsReferenceAudio 声音复刻用的本机音频样本（mp3/wav，≤10 MB，仅在合成时读取）
#   ttsFormat       输出格式：mp3 | wav
#   ttsRate         语速（0.5 ~ 2）
#   chromiumPath    浏览器采集通道用的 Chrome/Edge 路径（留空=自动发现）。
#                   **为什么有第二条通道**：Windows 11 24H2 上有些机器 DirectShow 采集坏了
#                   （相机应用正常），而 Chromium 的 Media Foundation 采集还能用。启动时先试
#                   ffmpeg，失败自动回落浏览器采集。
#   recordVideo     是否默认开启摄像头录像（true/false）。
#   recordAudio     是否默认开启录音（true/false）。
#   answerMode      话轮模式：manual | auto（docs/TURN-TAKING.md §4）。
#                   manual = 回答手动点发送（默认，与旧行为一致）；
#                   auto = 答完静音约 turnEndSilenceMs 后自动提交。
#                   **只管判定与自动提交，不管派活**——manual 下手动发送
#                   同样会唤醒助手出下一题。面板「面试中」页可随时切换。
#   turnEndSilenceMs 话轮结束的静音阈值（毫秒，800–6000，默认 2000）。
#                   与 450ms 的转写分段阈值是两回事：分段管字幕准实时，
#                   这个管「他答完了没有」。仅 auto 模式生效。
#   ffmpegPath      ffmpeg 的可执行文件路径。
#                   **摄像头是 Host 侧用 ffmpeg 采的**——DSH 桌面端的 Electron
#                   权限处理器只放行纯音频请求，摄像头在主进程就被拒了，改
#                   Windows 设置也没用。但插件的 Host 半边跑在 Node 宿主进程
#                   里，那儿没有那道闸门。
#                   留空 = 自动找：DSH_FFMPEG_PATH 环境变量 → PATH 上的
#                   ffmpeg → 若干常见安装位置。
#                   **ffmpeg 不是系统自带的**，别的机器上未必有。找不到时
#                   插件会如实说「这台机器没有摄像头采集程序」，面试本身不受
#                   影响（麦克风、键盘、报告照常）。
- insert:
    - id: interviewer
      name: 'dsh-realtime-interview'
      config:
        workspaceRoot: ''
        jdFetchTimeoutMs: 15000
        jdMaxChars: 20000
        asrProvider: 'auto'
        asrBaseUrl: ''
        asrApiKey: ''
        asrApiKeyEnv: 'MINIMAX_API_KEY'
        asrModel: ''
        asrEndpoint: ''
        asrLanguage: 'zh'
        ttsProvider: 'auto'
        ttsBaseUrl: ''
        ttsApiKeyEnv: ''
        ttsApiKey: ''
        ttsModel: ''
        ttsVoice: ''
        ttsStyle: ''
        ttsReferenceAudio: ''
        ttsFormat: 'mp3'
        ttsRate: 1.0
        recordVideo: true
        recordAudio: true
        answerMode: 'manual'
        turnEndSilenceMs: 2000
        ffmpegPath: ''
        chromiumPath: ''
